name: Desktop installers

# Unsigned builds (D55): download them from the run's artifacts, or from the
# GitHub release a v* tag creates (the tag must match apps/desktop/package.json).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, artifact: "release/*.dmg" }
          # latest*.yml and the block maps let installed apps update themselves (D58).
          - { name: Windows, os: windows-latest, artifact: "release/*.exe*" }
          - { name: Linux, os: ubuntu-latest, artifact: "release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @batvision/web build
      - run: pnpm --filter @batvision/desktop dist
      - uses: actions/upload-artifact@v7
        with:
          name: batvision-desktop-${{ matrix.name }}
          path: |
            apps/desktop/${{ matrix.artifact }}
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)"
            exit 1
          }
      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: batvision-desktop-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "batvision $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
