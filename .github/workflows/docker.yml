name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The server reports its Cargo version (/api/health): it must be the tag's.
      - name: Check the tag matches the server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$server" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match server/Cargo.toml ($server)"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/batvision
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The media server (RTX 5060) is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
