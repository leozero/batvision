name: Installers

# Desktop builds are unsigned (D55); the Android APK is signed with the release key
# (D65). Download them from the run's artifacts, or from the GitHub release a v* tag
# creates (the tag must match apps/desktop/package.json and apps/mobile/app.json).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, artifact: "release/*.dmg" }
          # latest*.yml and the block maps let installed apps update themselves (D58).
          - { name: Windows, os: windows-latest, artifact: "release/*.exe*" }
          - { name: Linux, os: ubuntu-latest, artifact: "release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @batvision/web build
      - run: pnpm --filter @batvision/desktop dist
      - uses: actions/upload-artifact@v7
        with:
          name: batvision-desktop-${{ matrix.name }}
          path: |
            apps/desktop/${{ matrix.artifact }}
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # Updates only install over an APK signed with the same key.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
            echo "No release key: the APK keeps the debug signature."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BATVISION_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          BATVISION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BATVISION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BATVISION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Phones only (arm64, armv7): x86 builds only serve emulators, and doubled the build.
          # APK for the GitHub release, AAB for the Play Store (D82): same native builds.
          ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache
          version=$(node -p 'require("../app.json").expo.version')
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/batvision-$version-android.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/batvision-$version.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: batvision-android
          path: apps/mobile/android/app/build/outputs/apk/release/batvision-*-android.apk
          if-no-files-found: error
          retention-days: 30
      # Not attached to the GitHub release (its pattern is batvision-*): for Play only.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/batvision-*.aab
          if-no-files-found: error
          retention-days: 90

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          for file in apps/desktop/package.json apps/mobile/package.json; do
            version=$(node -p "require('./$file').version")
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "::error::Tag $GITHUB_REF_NAME doesn't match $file ($version)"
              exit 1
            }
          done
          app=$(node -p 'require("./apps/mobile/app.json").expo.version')
          test "$GITHUB_REF_NAME" = "v$app" || { echo "::error::Tag doesn't match apps/mobile/app.json ($app)"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: batvision-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "batvision $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
