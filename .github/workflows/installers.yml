name: Installers

# Desktop builds are unsigned (D55); the Android APK is signed with the release key
# (D65). Download them from the run's artifacts, or from the GitHub release a v* tag
# creates (the tag must match apps/desktop/package.json and apps/mobile/app.json).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, artifact: "release/*.dmg" }
          # latest*.yml and the block maps let installed apps update themselves (D58).
          - { name: Windows, os: windows-latest, artifact: "release/*.exe*" }
          - { name: Linux, os: ubuntu-latest, artifact: "release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @batvision/web build
      - run: pnpm --filter @batvision/desktop dist
      - uses: actions/upload-artifact@v7
        with:
          name: batvision-desktop-${{ matrix.name }}
          path: |
            apps/desktop/${{ matrix.artifact }}
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # Updates only install over an APK signed with the same key.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
            echo "No release key: the APK keeps the debug signature."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BATVISION_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          BATVISION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BATVISION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BATVISION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Phones only (arm64, armv7): x86 builds only serve emulators, and doubled the build.
          # APK for the GitHub release, AAB for the Play Store (D82): same native builds.
          ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache
          version=$(node -p 'require("../app.json").expo.version')
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/batvision-$version-android.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/batvision-$version.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: batvision-android
          path: apps/mobile/android/app/build/outputs/apk/release/batvision-*-android.apk
          if-no-files-found: error
          retention-days: 30
      # Not attached to the GitHub release (its pattern is batvision-*): for Play only.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/batvision-*.aab
          if-no-files-found: error
          retention-days: 90

  # TestFlight (D94): signed in the cloud with the App Store Connect API key, so no
  # certificate or profile is kept in the repository. Skipped until the key is set.
  ios:
    name: iOS (TestFlight)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: App Store Connect key
        id: key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY is missing: no TestFlight build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.key.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.ready == 'true'
        name: Generate the iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios
      - if: steps.key.outputs.ready == 'true'
        name: Archive and upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without it, `| tail` hides a failed archive or upload and the job stays green.
          set -o pipefail
          auth=(-allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild archive -workspace BatVision.xcworkspace -scheme BatVision \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BatVision.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${auth[@]}" | tail -30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BatVision.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          for file in apps/desktop/package.json apps/mobile/package.json; do
            version=$(node -p "require('./$file').version")
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "::error::Tag $GITHUB_REF_NAME doesn't match $file ($version)"
              exit 1
            }
          done
          app=$(node -p 'require("./apps/mobile/app.json").expo.version')
          test "$GITHUB_REF_NAME" = "v$app" || { echo "::error::Tag doesn't match apps/mobile/app.json ($app)"; exit 1; }
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$server" || { echo "::error::Tag doesn't match server/Cargo.toml ($server)"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: batvision-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "BatVision $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
