name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg (real ffprobe test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    name: Web (lint, types, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end + generated client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg (encodes the test movie, runs the player's sessions)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          pnpm --filter @batvision/api-client generate
          git diff --exit-code -- packages/api-client \
            || (echo "::error::Run 'pnpm --filter @batvision/api-client generate' and commit the result." && exit 1)
      - run: pnpm --filter @batvision/web build
      - run: pnpm --filter @batvision/web exec playwright install --with-deps chromium
      - run: pnpm --filter @batvision/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  desktop:
    name: Desktop end-to-end (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg (encodes the test movie) and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download the Electron binary
        run: pnpm --filter @batvision/desktop exec electron --version
      - run: pnpm --filter @batvision/web build
      - run: pnpm --filter @batvision/desktop build
      - run: xvfb-run -a pnpm --filter @batvision/desktop test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7

  android:
    name: Android (engine tests, end-to-end on an emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg (encodes the test movie)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project (D74)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Sync engine unit tests (Kotlin, D64)
        working-directory: apps/mobile/android
        run: ./gradlew :batvision-sync:testDebugUnitTest --build-cache
      # Only the emulator's architecture: native code for all four took ~20 minutes.
      - name: Build the release APK (x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --build-cache
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_OUTPUT: ${{ github.workspace }}/apps/mobile/maestro-output
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: pnpm --filter @batvision/mobile test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e
          path: |
            apps/mobile/playwright-report
            apps/mobile/maestro-output
          retention-days: 7

  ios:
    name: iOS (engine tests, end-to-end on a simulator)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg (encodes the test movie)
        run: brew install ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync engine unit tests (Swift, D91)
        working-directory: apps/mobile/modules/batvision-sync/ios
        run: swift test
      - name: Generate the iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace BatVision.xcworkspace -scheme BatVision -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd build | tail -30
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      # The iPad is the main target (D85).
      - name: Boot an iPad simulator
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const all = Object.values(JSON.parse(require("fs").readFileSync(0)).devices).flat();
            // The 13-inch one: the sign-in flow taps the save-password prompt by position.
            const ipad = all.find((d) => d.name.startsWith("iPad Pro 13")) ?? all.find((d) => d.name.startsWith("iPad"));
            console.log(ipad.udid);')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: End-to-end on the simulator
        env:
          PLATFORM: ios
          MAESTRO_OUTPUT: ${{ github.workspace }}/apps/mobile/maestro-output
        run: pnpm --filter @batvision/mobile test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e
          path: |
            apps/mobile/playwright-report
            apps/mobile/maestro-output
          retention-days: 7
