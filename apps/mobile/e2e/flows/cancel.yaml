# Deleting the downloaded movie from the Downloads tab (D74).
appId: ${APP_ID}
---
- stopApp
- launchApp
# The tabs show once the session is checked: slow on CI simulators.
- extendedWaitUntil:
    visible:
      id: tab-downloads
    timeout: 60000
- tapOn:
    id: tab-downloads
- tapOn:
    id: more-movie-${MOVIE_ID}
- tapOn:
    id: confirm-cancel
- extendedWaitUntil:
    notVisible:
      id: local-movie-${MOVIE_ID}
    timeout: 30000
