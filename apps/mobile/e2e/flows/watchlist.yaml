# Watchlist tab, account episodes setting, and the device settings sheets (D73, D68).
appId: ${APP_ID}
---
- stopApp
- launchApp
# The tabs show once the session is checked: slow on CI simulators.
- extendedWaitUntil:
    visible:
      id: tab-movies
    timeout: 60000
- tapOn:
    id: tab-movies
# iOS reads the poster as one element, "Test Movie, 2020".
- tapOn:
    text: "Test Movie.*"
- tapOn:
    id: watchlist
# Two audio tracks: the language is asked first (the file's default track here).
- tapOn:
    id: watchlist-add
# The screen's own back button: iOS has no system one.
- tapOn:
    id: back
- tapOn:
    id: tab-watchlist
- assertVisible:
    id: watchlist-movie-${MOVIE_ID}
# Automatic downloads are off on this phone: the banner turns them on.
- tapOn:
    id: enable-auto
- extendedWaitUntil:
    notVisible:
      id: auto-off
    timeout: 15000
- tapOn:
    id: watchlist-episodes
- tapOn:
    id: choice-3
# Device settings: mobile data, picked in a sheet with an explanation per option.
- tapOn:
    id: tab-downloads
- tapOn:
    id: downloads-settings
- scrollUntilVisible:
    element:
      id: setting-mobile-data
- tapOn:
    id: setting-mobile-data
- tapOn:
    id: choice-light
- scrollUntilVisible:
    element:
      id: setting-mobile-cap
- tapOn:
    id: setting-mobile-cap
- tapOn:
    id: choice-5
