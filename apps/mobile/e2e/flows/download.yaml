# The movie is downloaded to the device by the native engine (encode, download, confirm).
appId: ${APP_ID}
---
- stopApp
- launchApp
# The tabs show once the session is checked: slow on CI simulators.
- extendedWaitUntil:
    visible:
      id: tab-movies
    timeout: 60000
- tapOn:
    id: tab-movies
# iOS reads the poster as one element, "Test Movie, 2020".
- tapOn:
    text: "Test Movie.*"
# The page is loaded (slow CI runners): only then is a missing button meaningful.
- extendedWaitUntil:
    visible:
      id: play
    timeout: 60000
# Optional: when the flow is retried, the request already went out.
- tapOn:
    id: download
    optional: true
- extendedWaitUntil:
    visible:
      id: local-done
    timeout: 240000
# The screen's own back button: iOS has no system one.
- tapOn:
    id: back
- tapOn:
    id: tab-downloads
- assertVisible:
    id: local-movie-${MOVIE_ID}
