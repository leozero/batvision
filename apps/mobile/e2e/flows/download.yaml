# The movie is downloaded to the phone by the Kotlin engine (encode, download, confirm).
appId: ${APP_ID}
---
- stopApp
- launchApp
- tapOn:
    id: tab-movies
- tapOn: Test Movie
# Optional: when the flow is retried, the request already went out.
- tapOn:
    id: download
    optional: true
- extendedWaitUntil:
    visible:
      id: local-done
    timeout: 240000
# The screen's own back button: iOS has no system one.
- tapOn:
    id: back
- tapOn:
    id: tab-downloads
- assertVisible:
    id: local-movie-${MOVIE_ID}
