# First launch: server address, then a user without 2FA signs in.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
# The harness grants notifications; the dialog may still show on some images.
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    id: server-address
- inputText: ${SERVER}
# Android: the keyboard hides the button. iOS: Return submits; hiding the keyboard on an
# iPad is a gesture that can leave the screen.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: connect
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- tapOn:
    id: username
- inputText: ${USERNAME}
- tapOn:
    id: password
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: sign-in
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      id: tab-movies
    timeout: 20000
# iOS offers to save the password, over the app.
- tapOn:
    text: "Not Now"
    optional: true
